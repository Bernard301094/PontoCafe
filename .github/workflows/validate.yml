name: Validate PontoCafe 1.0

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pontocafe-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests, typecheck and release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        shell: bash
        run: npm install --workspace backend --no-audit --no-fund

      - name: Backend validation
        shell: bash
        run: npm --workspace backend run validate

      - name: PontoCafe 1.0 release contract
        shell: bash
        run: npm run release:check

  android:
    name: Android Release tests and compile gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Release unit tests and compile
        shell: bash
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify Release APK contents
        shell: bash
        run: |
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$APK"
          # O Ponto deixou de reconhecer rostos: nenhum modelo facial pode
          # voltar ao APK, nem a permissão de câmera.
          ! unzip -l "$APK" | grep -q 'facenet'
          echo "Release candidate compiled without any face-recognition asset."

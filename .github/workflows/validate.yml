name: Validate PontoCafe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pontocafe-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Validate backend
        run: npm run validate

  android:
    name: Android tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compile Compose instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PontoCafe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release_unsigned:
    name: Release 0.10.0 aligned unsigned APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 0.10.0 source
        uses: actions/checkout@v4
        with:
          ref: b71b531917d846a4e292a26ce0086df8766fea02
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate exact version and commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "b71b531917d846a4e292a26ce0086df8766fea02"
          grep -q 'versionName = "0.10.0"' app/build.gradle.kts
          grep -q 'versionCode = 22' app/build.gradle.kts
      - name: Prepare exact FaceNet model
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 8 --retry-delay 3 \
            'https://raw.githubusercontent.com/shubham0204/FaceRecognition_With_FaceNet_Android/289bc10420aad15fed99094eee364eb24f908ecc/app/src/main/assets/facenet.tflite' \
            -o app/src/main/assets/facenet.tflite
          test "$(git hash-object app/src/main/assets/facenet.tflite)" = "8254aabae5cc73b8d2c15e7c589730eb3c264b87"
      - name: Build Release
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Zipalign Release
        shell: bash
        run: |
          INPUT='app/build/outputs/apk/release/app-release-unsigned.apk'
          OUTPUT='PontoCafe-0.10.0-b71b5319-aligned-unsigned.apk'
          test -f "$INPUT"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$INPUT" "$OUTPUT"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$OUTPUT"
          sha256sum "$OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PontoCafe-0.10.0-aligned-unsigned
          path: PontoCafe-0.10.0-b71b5319-aligned-unsigned.apk
          if-no-files-found: error
          retention-days: 7
